name: Deploy to Clone

on:
  workflow_call:
    inputs:
      clone_type:
        description: 'Clone type: TEST, UAT, or PREPROD'
        required: true
        type: string
      environment:
        description: 'Source environment: DEV or PROD'
        required: true
        type: string
      domain:
        description: 'Business domain (e.g. BRF, HR, FANDI)'
        required: true
        type: string
      db_name:
        description: 'Logical database name (e.g. CORE)'
        required: false
        type: string
        default: 'CORE'
      dcm_target:
        description: 'DCM manifest target name (e.g. DEV or PROD)'
        required: true
        type: string
      role:
        description: 'Snowflake role for clone operations'
        required: true
        type: string
      warehouse:
        description: 'Snowflake warehouse'
        required: false
        type: string
        default: 'BRF_WH'
    secrets:
      SNOWFLAKE_ACCOUNT:
        required: true
      SNOWFLAKE_USER:
        required: true
      SNOWFLAKE_PRIVATE_KEY:
        required: true

jobs:
  deploy-to-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SnowCLI
        uses: Snowflake-Labs/snowflake-cli-action@v1

      - name: Extract issue ID from branch
        id: extract
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          # Extract leading digits after the first slash
          ISSUE_ID=$(echo "$BRANCH" | sed -E 's|[^/]+/([0-9]+)-.*|\1|')
          CLONE_DB="${{ inputs.clone_type }}_${ISSUE_ID}_${{ inputs.domain }}_${{ inputs.db_name }}_DB"
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "clone_db=$CLONE_DB" >> "$GITHUB_OUTPUT"

      - name: Create clone
        run: |
          snow sql -q "USE ROLE ${{ inputs.role }}; USE WAREHOUSE ${{ inputs.warehouse }}; CALL ADMIN_DB.DEPLOY.DEPLOY_CLONE('${{ steps.extract.outputs.issue_id }}', '${{ inputs.environment }}', '${{ inputs.domain }}', '${{ inputs.db_name }}', '${{ inputs.clone_type }}');" \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_USER }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-path <(echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}")

      - name: Patch manifest to target clone
        run: |
          CLONE_DB="${{ steps.extract.outputs.clone_db }}"
          SOURCE_DB="${{ inputs.environment }}_${{ inputs.domain }}_${{ inputs.db_name }}_DB"

          # Replace project_name to point at the clone
          sed -i "s|project_name: ${SOURCE_DB}.DCM|project_name: ${CLONE_DB}.DCM|" dcm/manifest.yml

          # Replace template variables to resolve to the clone
          sed -i "s|db: ${SOURCE_DB}|db: ${CLONE_DB}|" dcm/manifest.yml
          sed -i "s|source_stage_db: ${SOURCE_DB}|source_stage_db: ${CLONE_DB}|" dcm/manifest.yml

          echo "Patched manifest — deploying to: ${CLONE_DB}"
          cat dcm/manifest.yml

      - name: Plan DCM changes
        run: |
          snow dcm plan --target ${{ inputs.dcm_target }} \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_USER }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-path <(echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}")

      - name: Deploy DCM to clone
        run: |
          snow dcm deploy --target ${{ inputs.dcm_target }} \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_USER }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-path <(echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}")

      - name: Run DCM tests
        run: |
          snow dcm test --target ${{ inputs.dcm_target }} \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_USER }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key-path <(echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}") || true
